[project]
name = "inspire-dictdiffer"
version = "0.0.7"
description = "Dictdiffer is a library that helps you to diff and patch dictionaries."
authors = [{ name = "Invenio Collaboration", email = "info@inveniosoftware.org" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/inspirehep/dictdiffer"
Repository = "https://github.com/inspirehep/dictdiffer"

[project.optional-dependencies]
numpy = ["numpy>=2.4.6,<3"]
tests = ["pytest>=9.1.1,<10"]
all = ["numpy>=2.4.6,<3", "pytest>=9.1.1,<10"]

[tool.poetry]
packages = [{ include = "inspire_dictdiffer" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=9.1.1,<10"

[build-system]
requires = ["poetry-core>=2.2.1,<3"]
build-backend = "poetry.core.masonry.api"
